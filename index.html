<html lang="ko">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --card: #ffffff;
    --border: #e0ddd5;
    --navy: #1a2f5e;
    --navy-light: #2a4480;
    --gold: #c8a96e;
    --gold-light: #e8c98e;
    --text: #1a2035;
    --text-muted: #6b7080;
    --text-light: #9ba0b0;
    --shadow: 0 4px 24px rgba(26,47,94,0.10);
    --shadow-hover: 0 8px 36px rgba(26,47,94,0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 상단 장식 */
  .top-bar {
    height: 4px;
    background: linear-gradient(90deg, var(--navy), var(--gold), var(--navy-light));
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* 헤더 */
  header {
    padding: 48px 0 36px;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    background: var(--gold);
    border-radius: 50%;
  }

  .brand-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--navy);
    text-transform: uppercase;
    font-weight: 600;
  }

  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    line-height: 1.4;
    color: var(--navy);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.12s forwards;
  }

  h1 em {
    font-style: normal;
    color: var(--gold);
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto 40px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.24s forwards;
  }

  /* 진행바 */
  .progress-wrap {
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.36s forwards;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--navy), var(--gold));
    border-radius: 4px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* 질문 카드 */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    margin-bottom: 20px;
    display: none;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    box-shadow: var(--shadow);
  }

  .question-card.active { display: block; }
  .question-card.visible { opacity: 1; transform: translateY(0); }

  .q-number {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .q-text {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(16px, 3vw, 20px);
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 24px;
    color: var(--navy);
  }

  /* 선택지 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.22s ease;
    text-align: left;
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .option:hover {
    border-color: var(--navy);
    background: rgba(26,47,94,0.04);
    transform: translateX(3px);
  }

  .option.selected {
    border-color: var(--navy);
    background: rgba(26,47,94,0.07);
  }

  .option.selected .option-key {
    background: var(--navy);
    color: white;
  }

  .option-key {
    font-size: 11px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.05em;
    min-width: 24px;
    height: 24px;
    border-radius: 6px;
    background: rgba(26,47,94,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.22s ease;
  }

  .option-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    padding-top: 2px;
  }

  /* 버튼 */
  .btn-wrap {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    justify-content: flex-end;
  }

  .btn {
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.22s ease;
    border: none;
  }

  .btn-prev {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
  }

  .btn-prev:hover {
    border-color: var(--navy);
    color: var(--navy);
  }

  .btn-next {
    background: var(--navy);
    color: white;
    box-shadow: 0 4px 16px rgba(26,47,94,0.25);
  }

  .btn-next:hover {
    background: var(--navy-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(26,47,94,0.3);
  }

  .btn-next:disabled {
    background: var(--border);
    color: var(--text-light);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  /* 결과 화면 */
  #result {
    display: none;
    text-align: center;
    padding: 20px 0 60px;
  }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 44px 32px;
    box-shadow: var(--shadow);
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  .result-badge {
    display: inline-block;
    padding: 5px 16px;
    background: rgba(200,169,110,0.12);
    border: 1px solid var(--gold);
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .result-stars {
    font-size: 18px;
    margin-bottom: 16px;
    color: var(--gold);
    letter-spacing: 4px;
  }

  .result-title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 20px;
    line-height: 1.3;
  }

  .result-divider {
    width: 40px;
    height: 3px;
    background: linear-gradient(90deg, var(--navy), var(--gold));
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .result-msg {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.9;
    max-width: 480px;
    margin: 0 auto 32px;
  }

  .result-cta {
    display: block;
    max-width: 300px;
    margin: 0 auto 16px;
    padding: 15px 32px;
    background: var(--navy);
    color: white;
    font-weight: 700;
    font-size: 14px;
    border-radius: 12px;
    text-decoration: none;
    font-family: 'Noto Sans KR', sans-serif;
    box-shadow: 0 4px 20px rgba(26,47,94,0.25);
    transition: all 0.25s ease;
  }

  .result-cta:hover {
    background: var(--navy-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(26,47,94,0.32);
  }

  .result-note {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 16px;
    line-height: 1.7;
  }

  .result-restart {
    display: inline-block;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
    background: none;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;

    border-top: 1px solid var(--border);
  }

    color: var(--navy);
    text-decoration: none;
    font-weight: 500;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .question-card { padding: 24px 18px; }
    .trust-item { padding: 0 16px; }
    .result-card { padding: 32px 20px; }
  }
</style>
</head>

function calcType(ans) {
  // 점수 기반 분류
  let scores = { pain: 0, exp: 0, hobby: 0, new: 0, seed: 0, first: 0 };

  // 고통발견형
  if (ans[0]==="B") scores.pain += 3;
  if (ans[1]==="A") scores.pain += 3;
  if (ans[4]==="A") scores.pain += 2;
  if (ans[8]==="A") scores.pain += 2;
  if (ans[2]==="A" || ans[2]==="B") scores.pain += 1;

  // 경험자산형
  if (ans[3]==="A" || ans[3]==="B") scores.exp += 3;
  if (ans[6]==="A" || ans[6]==="B") scores.exp += 3;
  if (ans[2]==="A") scores.exp += 2;
  if (ans[4]==="A" || ans[4]==="B") scores.exp += 1;

  // 소일거리형
  if (ans[8]==="D") scores.hobby += 3;
  if (ans[5]==="A") scores.hobby += 2;
  if (ans[9]==="A") scores.hobby += 2;
  if (ans[3]==="A") scores.hobby += 1;

  // 새출발형
  if (ans[0]==="A") scores.new += 3;
  if (ans[8]==="C") scores.new += 3;
  if (ans[1]==="B" || ans[1]==="C") scores.new += 1;

  // 씨앗여정형
  if (ans[0]==="C" || ans[0]==="D") scores.seed += 2;
  if (ans[1]==="C") scores.seed += 3;
  if (ans[2]==="C") scores.seed += 2;
  if (ans[4]==="C") scores.seed += 1;

  // 설레는첫걸음
  if (ans[2]==="C") scores.first += 2;
  if (ans[5]==="C") scores.first += 2;
  if (ans[9]==="C") scores.first += 2;
  if (ans[7]==="C") scores.first += 1;

  // 가장 높은 점수 유형 반환
  return Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
}

  },
  new: {
    type: "새 출발을 꿈꾸는 분",
    stars: "★★★",
    msg: "직장이 힘드셨군요. 그 마음, 충분히 이해합니다. 다만 창업은 도망이 아니라 방향이 필요합니다. 먼저 '왜'를 찾는 시간을 가져보세요. StarWhy가 그 길을 함께 걷겠습니다.",
    cta: "📞 방향 찾기 상담 신청"
  },
  seed: {
    type: "씨앗을 찾는 여정 중",
    stars: "★★",
    msg: "아직 씨앗을 못 찾으셨군요. 괜찮습니다. 사실 이 단계가 가장 중요합니다. 서두르지 않아도 됩니다. 일상에서 불편함을 발견하는 눈을 먼저 키워보세요.",
    cta: "📞 관찰하는 법 가이드 받기"
  },
  first: {
    type: "설레는 첫 걸음",
    stars: "★★",
    msg: "창업에 대한 설렘, 정말 소중합니다. 다만 그 설렘이 오래가려면 조금 더 준비하는 시간이 필요합니다. 정부 지원 프로그램부터 먼저 알아보세요. StarWhy가 그 첫 길을 안내해 드리겠습니다.",
    cta: "📞 정부 지원 프로그램 안내받기"
  }
};

let answers = [];

function buildQuestions() {
  const container = document.getElementById('questions');
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === 0 ? ' active' : '');
    card.id = 'q' + i;
    card.innerHTML = `
      <div class="q-number">질문 ${i+1} / ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${q.options.map(o => `
          <button class="option" onclick="selectOption(${i}, '${o.key}', this)">
            <span class="option-key">${o.key}</span>
            <span class="option-text">${o.text}</span>
          </button>
        `).join('')}
      </div>
      <div class="btn-wrap">
        ${i > 0 ? `<button class="btn btn-prev" onclick="prevQ(${i})">← 이전</button>` : ''}
        <button class="btn btn-next" id="next-${i}" onclick="nextQ(${i})" disabled>
          ${i < questions.length - 1 ? '다음 →' : '결과 보기 →'}
        </button>
      </div>
    `;
    container.appendChild(card);
    if (i === 0) setTimeout(() => card.classList.add('visible'), 500);
  });
}

function selectOption(qIdx, key, el) {
  const card = document.getElementById('q' + qIdx);
  card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  answers[qIdx] = key;
  document.getElementById('next-' + qIdx).disabled = false;
}

function nextQ(curr) {
  if (!answers[curr]) return;
  const card = document.getElementById('q' + curr);
  card.classList.remove('visible');
  setTimeout(() => {
    card.classList.remove('active');
    if (curr < questions.length - 1) {
      const next = document.getElementById('q' + (curr + 1));
      next.classList.add('active');
      setTimeout(() => next.classList.add('visible'), 50);
      updateProgress(curr + 1);
    } else {
      showResult();
    }
  }, 300);
}

function prevQ(curr) {
  const card = document.getElementById('q' + curr);
  card.classList.remove('visible');
  setTimeout(() => {
    card.classList.remove('active');
    const prev = document.getElementById('q' + (curr - 1));
    prev.classList.add('active');
    setTimeout(() => prev.classList.add('visible'), 50);
    updateProgress(curr - 1);
  }, 300);
}

function updateProgress(idx) {
  const pct = Math.round((idx / questions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `질문 ${idx + 1} / ${questions.length}`;
  document.getElementById('progress-pct').textContent = pct + '%';
}

function showResult() {
  document.getElementById('questions').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';
  document.getElementById('trust-section').style.display = 'none';

  const typeKey = calcType(answers);
  const matched = results[typeKey];

  document.getElementById('result-stars').textContent = matched.stars;
  document.getElementById('result-title').textContent = matched.type;
  document.getElementById('result-msg').textContent = matched.msg;
  document.getElementById('result-cta').textContent = matched.cta;

  // 유형별 랜딩2 연결
  const ctaBtn = document.getElementById('result-cta');
  const landing2Map = {
    new:   'landing2_new.html',
    hobby: 'landing2_hobby.html',
    seed:  'landing2_seed.html',
    exp:   'landing2_exp.html',
    pain:  'landing2_pain.html',
    first: 'landing2_first.html'
  };
  if (landing2Map[typeKey]) {
    ctaBtn.href = landing2Map[typeKey];
  } else {
    ctaBtn.href = 'https://pf.kakao.com/_FxkxoxbX/chat';
  }

  const result = document.getElementById('result');
  result.style.display = 'block';
}

function restart() {
  answers = [];
  document.getElementById('result').style.display = 'none';
  document.getElementById('questions').style.display = 'block';
  document.querySelector('.progress-wrap').style.display = 'block';
  document.getElementById('trust-section').style.display = 'block';

  document.querySelectorAll('.question-card').forEach((c, i) => {
    c.classList.remove('active', 'visible');
    c.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    const btn = document.getElementById('next-' + i);
    if (btn) btn.disabled = true;
  });

  const first = document.getElementById('q0');
  first.classList.add('active');
  setTimeout(() => first.classList.add('visible'), 50);
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-text').textContent = '질문 1 / 10';
  document.getElementById('progress-pct').textContent = '0%';
}

buildQuestions();
</script>
</body>
</html>
