<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startway — 나에게 맞는 방 찾기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f7f4ef; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2.5rem 1rem 4rem; }
    .sw-logo { font-size: 12px; letter-spacing: 0.18em; color: #999; font-weight: 700; text-transform: uppercase; margin-bottom: 2rem; }
    .sw-card { background: #fff; border-radius: 20px; border: 0.5px solid #e0dbd2; padding: 2.5rem 2rem; max-width: 520px; width: 100%; }
    .sw-dots { display: flex; gap: 6px; margin-bottom: 2rem; justify-content: center; }
    .sw-dot { width: 28px; height: 4px; border-radius: 4px; background: #e0dbd2; transition: background 0.3s; }
    .sw-dot.active { background: #3d6b4f; }
    .sw-dot.done { background: #8cb89a; }
    .sw-label { font-size: 11px; letter-spacing: 0.12em; color: #3d6b4f; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; }
    .sw-q { font-size: 21px; font-weight: 700; color: #1a1a1a; line-height: 1.45; margin-bottom: 0.4rem; }
    .sw-sub { font-size: 13px; color: #999; margin-bottom: 1.8rem; line-height: 1.6; }
    .sw-opts { display: flex; flex-direction: column; gap: 10px; }
    .sw-opt { display: flex; align-items: flex-start; gap: 14px; padding: 15px 16px; border-radius: 14px; border: 1.5px solid #e8e2d8; background: #faf8f5; cursor: pointer; transition: border-color 0.2s, background 0.2s, transform 0.12s; text-align: left; width: 100%; }
    .sw-opt:hover { border-color: #3d6b4f; background: #f0f7f2; transform: translateY(-1px); }
    .sw-opt.sel { border-color: #3d6b4f; background: #eef5f0; }
    .sw-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .ia { background: #fde8d8; } .ib { background: #ddeaf8; } .ic { background: #e8f4ea; }
    .sw-ot { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
    .sw-od { font-size: 13px; color: #999; line-height: 1.5; }
    .sw-result { text-align: center; }
    .sw-badge { display: inline-block; padding: 7px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 1rem; }
    .b-burn { background: #fde8d8; color: #b04e18; }
    .b-isol { background: #ddeaf8; color: #1a4f8a; }
    .b-drif { background: #e8f4ea; color: #2a6e3e; }
    .sw-remoji { font-size: 44px; margin-bottom: 0.8rem; display: block; }
    .sw-rtitle { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 0.6rem; line-height: 1.35; }
    .sw-rmsg { font-size: 14px; color: #555; line-height: 1.8; margin-bottom: 0.5rem; }
    .sw-rmission { background: #f7f4ef; border-radius: 12px; padding: 14px 16px; margin: 1.2rem 0; text-align: left; }
    .sw-rmission-label { font-size: 11px; font-weight: 700; color: #3d6b4f; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
    .sw-rmission-text { font-size: 14px; color: #333; line-height: 1.6; }
    .sw-rauthor { font-size: 12px; color: #bbb; margin-bottom: 1.5rem; }
    .sw-nbtn { display: block; width: 100%; padding: 15px; border-radius: 12px; text-align: center; font-size: 15px; font-weight: 700; text-decoration: none; margin-bottom: 8px; cursor: pointer; border: none; transition: opacity 0.2s, transform 0.12s; color: #fff; }
    .sw-nbtn:hover { opacity: 0.88; transform: translateY(-1px); }
    .nb-burn { background: #f4a97a; } .nb-isol { background: #5b9bd5; } .nb-drif { background: #5aaa72; }
    .sw-kbtn { display: block; width: 100%; padding: 13px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; background: #fae100; color: #3b1e08; border: none; cursor: pointer; transition: opacity 0.2s; }
    .sw-kbtn:hover { opacity: 0.88; }
    .sw-footer { font-size: 12px; color: #ccc; text-align: center; margin-top: 1.5rem; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .slide { animation: slideIn 0.3s cubic-bezier(0.22, 0.8, 0.36, 1) both; }
  </style>
</head>
<body>

  <div class="sw-logo">Startway</div>
  <div class="sw-card">
    <div class="sw-dots" id="dots"></div>
    <div id="screen" class="slide"></div>
  </div>
  <div class="sw-footer">Startway | 하나씩. 꾸준히. 끝까지.</div>

  <script>

    /* ============================================================
       ★ 데이터 영역 — 문항·결과·URL 수정은 여기서만 하세요
       ============================================================ */

    /* -- 외부 링크 -- */
    const LINKS = {
      notion: {
        burnout:  'https://www.notion.so/360ad6f31a3b8035bf0ceb7cd60c0976',
        isolated: 'https://www.notion.so/360ad6f31a3b80c081edcba5927194d1',
        drifting: 'https://www.notion.so/360ad6f31a3b80a19a2bdb24dd79fe17'
      },
      kakao: 'https://pf.kakao.com/_FxkxoxbX/chat'
    };

    /* -- 질문 데이터 --
       iconClass: ia=주황, ib=파랑, ic=초록
       autoNext: true = 선택 즉시 자동 이동 */
    const QUESTIONS = [
      {
        label: '질문 1 / 3',
        question: '요즘 하루가 어떻게 느껴지나요?',
        sub: '가장 솔직하게 느껴지는 것을 골라 주세요.',
        autoNext: true,
        options: [
          { id: 'burnout',  iconClass: 'ia', emoji: '🔥', title: '바쁜데 공허하다',       desc: '열심히 사는데 뭔가 텅 빈 느낌' },
          { id: 'isolated', iconClass: 'ib', emoji: '🌙', title: '조용한데 외롭다',       desc: '아무 문제 없는데 혼자인 느낌' },
          { id: 'drifting', iconClass: 'ic', emoji: '🍃', title: '편한데 뭔가 빠진 느낌', desc: '불편하진 않은데 방향을 잃은 것 같다' }
        ]
      },
      {
        label: '질문 2 / 3',
        question: '지금 가장 하고 싶은 것은?',
        sub: '마음이 가는 쪽을 솔직하게 골라 주세요.',
        autoNext: true,
        options: [
          { id: 'action',  iconClass: 'ia', emoji: '⚡', title: '뭔가 바로 해보고 싶다',          desc: '일단 움직이면서 방향을 찾고 싶다' },
          { id: 'connect', iconClass: 'ib', emoji: '💬', title: '누군가 얘기를 들어줬으면',       desc: '판단 없이 그냥 들어주는 사람이 필요하다' },
          { id: 'reflect', iconClass: 'ic', emoji: '🪞', title: '혼자 조용히 생각 정리하고 싶다', desc: '잠깐 멈추고 나를 들여다보고 싶다' }
        ]
      },
      {
        label: '질문 3 / 3',
        question: '변화를 시작한다면 언제?',
        sub: '무리하게 다짐하지 않아도 됩니다.',
        autoNext: true,
        options: [
          { id: 'now',    iconClass: 'ia', emoji: '🚀',  title: '지금 당장',     desc: '시간도 있고 마음의 준비도 됐다' },
          { id: 'soon',   iconClass: 'ib', emoji: '📅',  title: '이번 주 안에',  desc: '조금 준비하면 시작할 수 있을 것 같다' },
          { id: 'unsure', iconClass: 'ic', emoji: '🌫️', title: '아직 모르겠다', desc: '솔직히 아직 모르겠다. 그래도 괜찮다.' }
        ]
      }
    ];

    /* -- 결과 데이터 --
       구조: RESULTS[Q1답변].messages[Q2답변] → 제목+메시지
             RESULTS[Q1답변].missions[Q3답변] → 오늘의 미션 */
    const RESULTS = {
      burnout: {
        badge: '너무 애쓴 당신에게',
        badgeClass: 'b-burn',
        emoji: '🟢',
        notionKey: 'burnout',
        btnClass: 'nb-burn',
        btnLabel: '🟢 애쓴 당신에게 → 맞춤방 열기',
        messages: {
          action:  { title: '쉬는 것도 실력입니다.',     msg: '지금 당장 뭔가 하고 싶은 마음, 압니다.\n하지만 오늘만큼은 20분 핸드폰을 뒤집고 창밖을 보세요.\n그게 오늘의 미션입니다.' },
          connect: { title: '잘 하려고 너무 애쓰셨군요.', msg: '누군가 들어줬으면 하는 마음이 드는 건\n이미 충분히 혼자 버텼다는 신호입니다.\n카카오채널에 한 줄만 남겨 주세요.' },
          reflect: { title: '멈추는 것도 용기입니다.',   msg: '조용히 생각 정리하고 싶다면,\n그 감각을 믿으세요.\n오늘은 아무 결론 없이 그냥 앉아만 있어도 됩니다.' }
        },
        missions: {
          now:    '오늘 퇴근 후 목적지 없이 30분 동네 한 바퀴를 걸어보세요.',
          soon:   '이번 주 안에 좋아하는 취미를 결과 없이 30분만 해보세요.',
          unsure: '지금은 쉬어가도 됩니다. 준비되면 그때 시작해요.'
        }
      },
      isolated: {
        badge: '혼자였던 당신에게',
        badgeClass: 'b-isol',
        emoji: '🔵',
        notionKey: 'isolated',
        btnClass: 'nb-isol',
        btnLabel: '🔵 혼자인 날 → 맞춤방 열기',
        messages: {
          action:  { title: '작은 연결부터 시작해 봅시다.',     msg: '바로 뭔가 하고 싶다면,\n오늘 10분만 밖에 나가 햇볕을 쬐어보세요.\n사람 말고 햇빛이랑 먼저 연결하는 겁니다.' },
          connect: { title: '오늘은 사람 말고, 햇빛이랑 먼저요.', msg: '누군가 들어줬으면 하는 마음,\n그 마음 자체가 아직 살아있다는 신호입니다.\n카카오채널에 한 줄 남겨 주세요. 읽어만 줄게요.' },
          reflect: { title: '자세히 보아야 예쁘다.',             msg: '오래 보아야 사랑스럽다. 너도 그렇다.\n\n오늘은 기분 일기 한 줄만 써보세요.\n잘 쓸 필요 없습니다.' }
        },
        missions: {
          now:    '오늘 먹고 싶었던 것 하나, 혼자 사먹어 보세요.',
          soon:   '이번 주 안에 기분 일기 한 줄을 써보세요.',
          unsure: '지금은 그냥 여기 있어도 됩니다. 연결은 천천히 해요.'
        }
      },
      drifting: {
        badge: '방향을 찾는 당신에게',
        badgeClass: 'b-drif',
        emoji: '🟡',
        notionKey: 'drifting',
        btnClass: 'nb-drif',
        btnLabel: '🟡 뭔가 빠진 날 → 맞춤방 열기',
        messages: {
          action:  { title: '방향을 모르는 게 아닙니다.',      msg: '아직 발견을 못 한 겁니다.\n일단 움직이고 싶다면, 단골 카페를 정해서\n혼자 1시간 앉아 있어보세요. 생각이 찾아옵니다.' },
          connect: { title: '서두르지 않아도 됩니다.',         msg: '뭔가 빠진 느낌, 누군가와 나누고 싶은 마음.\n그 감각이 이미 방향을 찾고 있다는 뜻입니다.\n카카오채널에 한 줄 남겨 주세요.' },
          reflect: { title: '인생은 멀리서 보면 희극입니다.', msg: '지금 방향이 안 보이는 건 너무 가까이 보고 있어서일 수 있습니다.\n책 한 권을 꺼내 첫 장만 읽어보세요.\n《어떻게 살 것인가》 추천합니다.' }
        },
        missions: {
          now:    '오늘 전시장이나 박물관에 혼자 천천히 다녀와 보세요.',
          soon:   '이번 주 안에 책 한 권 첫 장만 읽어보세요.',
          unsure: '서두르지 않아도 됩니다. 여기서 천천히 시작해요.'
        }
      }
    };

    /* ============================================================
       ★ 엔진 영역 — 아래는 건드리지 마세요
       ============================================================ */

    let step = 0;
    const ans = { q1: null, q2: null, q3: null };
    const keys = ['q1', 'q2', 'q3'];
    let locked = false;

    function renderDots() {
      document.getElementById('dots').innerHTML = [0, 1, 2].map(i => {
        let c = 'sw-dot';
        if (i < step) c += ' done';
        else if (i === step) c += ' active';
        return `<div class="${c}"></div>`;
      }).join('');
    }

    function renderQ() {
      const q = QUESTIONS[step];
      const key = keys[step];
      locked = false;
      renderDots();
      const s = document.getElementById('screen');
      s.className = 'slide';
      s.innerHTML = `
        <div class="sw-label">${q.label}</div>
        <div class="sw-q">${q.question}</div>
        <div class="sw-sub">${q.sub}</div>
        <div class="sw-opts">
          ${q.options.map(o => `
            <button class="sw-opt" onclick="pick(this,'${key}','${o.id}')">
              <div class="sw-icon ${o.iconClass}">${o.emoji}</div>
              <div>
                <div class="sw-ot">${o.title}</div>
                <div class="sw-od">${o.desc}</div>
              </div>
            </button>`).join('')}
        </div>`;
    }

    function pick(el, key, id) {
      if (locked) return;
      locked = true;
      ans[key] = id;
      el.closest('.sw-opts').querySelectorAll('.sw-opt').forEach(b => b.classList.remove('sel'));
      el.classList.add('sel');
      setTimeout(() => {
        if (step < 2) { step++; renderQ(); }
        else showResult();
      }, 320);
    }

    function showResult() {
      const r = RESULTS[ans.q1];
      const msg = r.messages[ans.q2];
      const mission = r.missions[ans.q3];
      renderDots();
      const s = document.getElementById('screen');
      s.className = 'slide';
      s.innerHTML = `
        <div class="sw-result">
          <div class="sw-badge ${r.badgeClass}">${r.badge}</div>
          <div class="sw-remoji">${r.emoji}</div>
          <div class="sw-rtitle">${msg.title}</div>
          <div class="sw-rmsg">${msg.msg.replace(/\n/g, '<br>')}</div>
          <div class="sw-rmission">
            <div class="sw-rmission-label">오늘의 미션</div>
            <div class="sw-rmission-text">${mission}</div>
          </div>
          <div class="sw-rauthor">— 허재원</div>
          <button class="sw-nbtn ${r.btnClass}" onclick="location.href='${LINKS.notion[r.notionKey]}'">${r.btnLabel}</button>
          <button class="sw-kbtn" onclick="location.href='${LINKS.kakao}'">💬 카카오채널에 한마디 남기기</button>
        </div>`;
    }

    renderQ();

  </script>
</body>
</html>
